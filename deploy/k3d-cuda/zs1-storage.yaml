# Namespace, disks and GPU budget for the emulator sessions.
#
# The BIOS and the disc images stay on the host and are never baked into an
# image: an image can be pushed to a registry, a bind mount cannot. They reach a
# pod in two hops — k3d bind-mounts the host directory into every node at
# cluster creation, and these PVs expose that node path to one namespace only.
#
# Each PV pins claimRef to a specific namespace/name up front, so the volume can
# only ever bind to that claim. Without it any namespace could create a matching
# PVC and mount the discs.
apiVersion: v1
kind: Namespace
metadata:
  name: zs1
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: zs1-roms
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: zs1
    name: roms
  hostPath:
    path: /mnt/zs1/roms
    type: Directory
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: zs1-games
spec:
  capacity:
    storage: 8Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: zs1
    name: games
  hostPath:
    path: /mnt/zs1/games
    type: Directory
---
# Writable: memory cards and savestates. Every boot runs the card driver's write
# test, so this one must not be read-only.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: zs1-data
spec:
  capacity:
    storage: 4Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: zs1
    name: data
  hostPath:
    path: /mnt/zs1/data
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: roms
  namespace: zs1
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: zs1-roms
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: games
  namespace: zs1
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: zs1-games
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: zs1
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: zs1-data
  resources:
    requests:
      storage: 4Gi
---
# The cluster advertises 5 GPUs per node across 4 nodes = 20, but there is one
# physical RTX 4060. This quota is what keeps the scheduler honest: at most 5
# GPU-holding pods can exist in this namespace at once, which is the session
# count the machine is sized for.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gpu-budget
  namespace: zs1
spec:
  hard:
    requests.nvidia.com/gpu: "5"
    limits.nvidia.com/gpu: "5"
