# Publishing the sessions beyond the cluster.
#
# Until now a session was ClusterIP only, so reaching one needed cluster
# credentials and the read-only BIOS and disc mounts were unreachable from any
# network. An Ingress removes that, so it carries basic auth: without the
# middleware anyone who can route to the host can drive the emulated machine.
#
# No credential is in this file and none may be: a committed htpasswd hash is a
# committed credential. One secret per game, created out of band — see the
# README. Losing them costs nothing but retyping; they exist only in the cluster
# and in whatever the operator keeps them in.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: zs1-ratelimit
  namespace: zs1
spec:
  rateLimit:
    average: 20
    burst: 40
    period: 1s
---
# Ordinary hardening. Most of it only matters once this is reachable from a
# hostile network, which is exactly when it is too late to add it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: zs1-headers
  namespace: zs1
spec:
  headers:
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: no-referrer
    # The player page frames noVNC from its own origin, so deny would break it.
    customFrameOptionsValue: SAMEORIGIN
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
# One credential per game rather than one for all three: a password that leaks
# from a shared screen or a browser history then costs one session, not every
# session. Secrets are created out of band — see the note at the top of this file.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: zs1-auth-acecombat
  namespace: zs1
spec:
  basicAuth:
    secret: zs1-auth-acecombat
    realm: ZoniStation One — acecombat
---
# One credential per game rather than one for all three: a password that leaks
# from a shared screen or a browser history then costs one session, not every
# session. Secrets are created out of band — see the note at the top of this file.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: zs1-auth-crash
  namespace: zs1
spec:
  basicAuth:
    secret: zs1-auth-crash
    realm: ZoniStation One — crash
---
# One credential per game rather than one for all three: a password that leaks
# from a shared screen or a browser history then costs one session, not every
# session. Secrets are created out of band — see the note at the top of this file.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: zs1-auth-dino
  namespace: zs1
spec:
  basicAuth:
    secret: zs1-auth-dino
    realm: ZoniStation One — dino
---
# Host-based, not path-based: noVNC loads its assets from absolute paths, so a
# prefix like /acecombat/ would break every one of them. *.localhost resolves to
# 127.0.0.1 without touching /etc/hosts on this machine.
#
# Three backends behind one host. The order matters — Traefik matches the most
# specific path first, so /ws and /audio must be declared before /.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zs1-acecombat
  namespace: zs1
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: zs1-zs1-ratelimit@kubernetescrd,zs1-zs1-headers@kubernetescrd,zs1-zs1-auth-acecombat@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: acecombat.localhost
      http:
        paths:
          # WebRTC signalling. Traefik upgrades to WebSocket on its own.
          - path: /ws
            pathType: Prefix
            backend: { service: { name: zs1-acecombat, port: { number: 6082 } } }
          # The HTTP audio stream used by the VNC page.
          - path: /audio
            pathType: Prefix
            backend: { service: { name: zs1-acecombat, port: { number: 6081 } } }
          # noVNC, its own websocket, and the two player pages.
          - path: /
            pathType: Prefix
            backend: { service: { name: zs1-acecombat, port: { number: 6080 } } }
---
